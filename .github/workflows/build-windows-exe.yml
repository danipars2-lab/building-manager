name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'main.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows-exe.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Use ANGLE's Direct3D-backed OpenGL implementation on headless CI.
      KIVY_GL_BACKEND: angle_sdl2
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kivy[base]==2.3.1" openpyxl reportlab pyinstaller

      - name: Verify Kivy graphics backend
        run: |
          python -c "import os; print('KIVY_GL_BACKEND=', os.environ.get('KIVY_GL_BACKEND')); import kivy; print('Kivy', kivy.__version__)"

      - name: Build Windows application
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name BuildingManager --collect-data kivy --collect-binaries kivy --hidden-import kivy.core.window._window_sdl2 --hidden-import kivy.core.text --hidden-import kivy.core.text.text_sdl2 --hidden-import openpyxl --hidden-import reportlab main.py

      - name: Package application
        shell: pwsh
        run: |
          Compress-Archive -Path dist/BuildingManager -DestinationPath BuildingManager-Windows.zip -Force

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: building-manager-windows
          path: BuildingManager-Windows.zip
          if-no-files-found: error
          retention-days: 14
