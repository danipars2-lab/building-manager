name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'main.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows-exe.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kivy[base]==2.3.1" openpyxl reportlab pyinstaller

      - name: Build Windows application
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name BuildingManager --collect-all kivy --collect-all kivy_deps.sdl2 --collect-all kivy_deps.glew --collect-all kivy_deps.angle --collect-all openpyxl --collect-all reportlab main.py

      - name: Package application
        shell: pwsh
        run: |
          Compress-Archive -Path dist/BuildingManager -DestinationPath BuildingManager-Windows.zip -Force

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: building-manager-windows
          path: BuildingManager-Windows.zip
          if-no-files-found: error
          retention-days: 14
